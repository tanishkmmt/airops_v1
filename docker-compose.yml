services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      source-service:
        condition: service_healthy
      contract-service:
        condition: service_healthy
      block-service:
        condition: service_healthy

  source-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: services.source_service.main
    environment:
      MAX_UPLOAD_BYTES: "20971520"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  contract-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: services.contract_service.main
    environment:
      AIR_OPS_ENV: production
      AIR_OPS_PROFILE_PATH: /data/airline_profiles.json
    volumes:
      - airline-profiles:/data
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 3s
      retries: 3
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  block-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: services.block_service.main
    environment:
      AIR_OPS_ENV: production
      AIR_OPS_BLOCK_PROFILE_PATH: /data/block_profiles.json
    volumes:
      - block-profiles:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

volumes:
  airline-profiles:
  block-profiles:
